<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>크리스마스 조명 미리보기</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#101923;color:#f3f5f8;min-height:100dvh;display:grid;place-items:center;padding:20px}main{width:min(100%,1000px)}h1{font-size:21px;margin:0 0 14px}video{display:block;width:100%;border-radius:14px;background:#080e15}p{color:#bdc9d5;font-size:14px;line-height:1.7}nav{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #506070;background:#203040;border-radius:8px;padding:10px 14px;color:#fff;cursor:pointer;font:inherit;font-size:14px}button:hover{background:#30465c}output{display:block;color:#ffdc9e;font-variant-numeric:tabular-nums;margin:12px 0;font-size:14px}
</style>
</head>
<body><main>
<h1>크리스마스 조명 미리보기</h1>
<video id="preview" controls autoplay muted loop playsinline preload="auto" aria-label="트리는 3초, 집안 조명은 9초 주기로 빛나는 영상" src="christmas-lights-v15.mp4"></video>
<output id="playback" aria-live="off">불러오는 중…</output>
<nav aria-label="영상 구간 선택"><button type="button" data-time="0">처음부터 재생</button><button type="button" data-time="2.5">밝은 장면에서 재생</button><button type="button" data-time="1">어두운 장면에서 재생</button></nav>
<p>트리 전구는 3초, 집 안 조명은 9초 주기로 밝아졌다가 어두워집니다.</p>
</main>
<script>
const video=document.getElementById('preview'),output=document.getElementById('playback');
const stamp=s=>'00:'+String(Math.floor(s||0)).padStart(2,'0');
const update=()=>{output.textContent=(video.paused?'일시정지':'재생 중')+' · '+stamp(video.currentTime)+' / '+stamp(video.duration);};
for(const event of ['timeupdate','play','pause','loadedmetadata'])video.addEventListener(event,update);
video.addEventListener('error',()=>{output.textContent='영상을 불러오지 못했습니다. 페이지를 다시 열어 주세요.';});
for(const button of document.querySelectorAll('[data-time]'))button.addEventListener('click',()=>{video.currentTime=Number(button.dataset.time);video.play().catch(update);});
video.play().catch(update);
</script></body></html>
